[package]
name = "zanryo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
zanryo-core = { path = "../../crates/zanryo-core" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
